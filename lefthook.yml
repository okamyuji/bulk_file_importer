pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "gitleaks is required. Install with: brew install gitleaks"
          exit 1
        fi
        gitleaks git --staged --redact --no-banner

    rubocop:
      glob: "*.{rb,rake,ru}"
      run: bundle exec rubocop --force-exclusion {staged_files}
    syntax_tree:
      glob: "*.{rb,rake,ru}"
      run: bundle exec stree check {staged_files}
    sorbet:
      glob: "*.rb"
      run: bundle exec srb tc
    erb_lint:
      glob: "*.erb"
      run: bundle exec erb_lint {staged_files}

    frontend_oxlint:
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx,js,jsx}"
      run: pnpm exec oxlint {staged_files}
    frontend_oxfmt:
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx,css,json}"
      run: pnpm exec oxfmt --check {staged_files}
    frontend_typecheck:
      glob: "frontend/**/*.{ts,tsx}"
      run: pnpm --dir frontend typecheck
    frontend_stylelint:
      root: "frontend/"
      glob: "frontend/**/*.css"
      run: pnpm exec stylelint {staged_files}

pre-push:
  commands:
    specs:
      run: bundle exec rspec --fail-fast
