# セキュリティパッチ適用のための minimumReleaseAge (7日) の例外。
# nanoid 3.3.17 は 2026-08-03 公開の GHSA 修正版で、公開から7日未満のため
# 既定ポリシーでは取得できない。上流が修正版を取り込んだら削除してよい。
minimumReleaseAgeExclude:
  - nanoid
