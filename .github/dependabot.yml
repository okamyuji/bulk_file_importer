version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # One grouped PR per week: concurrent bundler PRs conflict on adjacent
  # Gemfile.lock CHECKSUMS lines; hand-resolving that conflict is how stale
  # CHECKSUMS reach main.
  groups:
    bundler:
      patterns:
        - "*"
- package-ecosystem: npm
  directory: "/frontend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # pnpm rejects versions newer than 7 days (minimumReleaseAge), so propose only those.
  cooldown:
    default-days: 7
  groups:
    npm:
      patterns:
        - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns:
        - "*"
