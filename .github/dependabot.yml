version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # One grouped PR per week: concurrent bundler PRs conflict on adjacent
  # Gemfile.lock CHECKSUMS lines; hand-resolving that conflict is how stale
  # CHECKSUMS reach main.
  groups:
    bundler:
      patterns:
        - "*"
- package-ecosystem: npm
  directory: "/frontend"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # pnpm installs only versions at least 7 days old (minimumReleaseAge); cooldown keeps version-update PRs within that.
  cooldown:
    default-days: 7
  # typescript-eslint 8.71 requires typescript <6.1.0; TypeScript 7 breaks lint.
  # Remove when typescript-eslint's peerDependencies allow the next TypeScript.
  ignore:
    - dependency-name: typescript
      versions: [">=6.1.0"]
  groups:
    npm:
      patterns:
        - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns:
        - "*"
