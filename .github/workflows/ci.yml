name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-scan:
    permissions:
      contents: read
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  rails-ci:
    permissions:
      contents: read
      pull-requests: write
    uses: okamyuji/reusable-workflows/.github/workflows/rails-ci.yml@v1
    with:
      with-mysql: true
      # サービスコンテナの root はパスワード無し。空の DB_PASSWORD を渡し、
      # database.yml の既定値と .env.test（dotenv は既存の値を上書きしない）を退ける。
      test-command: "export DB_PASSWORD= && bin/rails db:test:prepare && bundle exec rspec"
      dependabot-recreate: true
